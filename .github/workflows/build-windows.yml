name: Build Cataclysm AI for Windows

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      VCPKG_BINARY_SOURCES: "default"
      BN_REF: "660c2618548844449f88bdeae7af702b9f0cc83c"

    steps:
      - name: Checkout Cataclysm AI repository
        uses: actions/checkout@v4

      - name: Checkout pinned Bright Nights
        uses: actions/checkout@v4
        with:
          repository: cataclysmbn/Cataclysm-BN
          ref: ${{ env.BN_REF }}
          path: bn

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install stable CMake
        uses: lukka/get-cmake@v3.31.6

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable("ACTIONS_CACHE_URL", process.env.ACTIONS_CACHE_URL || "")
            core.exportVariable("ACTIONS_RESULTS_URL", process.env.ACTIONS_RESULTS_URL || "")
            core.exportVariable("ACTIONS_RUNTIME_TOKEN", process.env.ACTIONS_RUNTIME_TOKEN || "")

      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          $mode = "readwrite"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $mode = "read"
          }
          "VCPKG_BINARY_SOURCES=clear;x-gha,$mode" >> $env:GITHUB_ENV

      - name: Install vcpkg
        uses: lukka/run-vcpkg@main
        id: runvcpkg
        with:
          vcpkgDirectory: "${{ github.workspace }}/../b/vcpkg"

      - name: Integrate vcpkg
        shell: pwsh
        run: vcpkg integrate install

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-cataclysm-ai-${{ env.BN_REF }}
          restore-keys: |
            windows-cataclysm-ai-${{ env.BN_REF }}
            windows-cataclysm-ai-
          max-size: 3G
          verbose: 2
          save: ${{ github.event_name != 'pull_request' }}

      - name: Configure ccache for MSVC
        shell: pwsh
        run: |
          "CCACHE_BASEDIR=${{ github.workspace }}" >> $env:GITHUB_ENV
          "CCACHE_SLOPPINESS=include_file_ctime,include_file_mtime,time_macros,pch_defines" >> $env:GITHUB_ENV
          "CCACHE_NOHASHDIR=1" >> $env:GITHUB_ENV
          "CCACHE_COMPILERCHECK=content" >> $env:GITHUB_ENV

      - name: Apply Cataclysm AI engine bridge
        shell: pwsh
        run: .\scripts\apply_bridge.ps1 -BnRoot "$env:GITHUB_WORKSPACE\bn"

      - name: Install Cataclysm AI mod into source tree
        shell: pwsh
        run: |
          $dst = "$env:GITHUB_WORKSPACE\bn\data\mods\CataclysmAI"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path "$env:GITHUB_WORKSPACE\mod\CataclysmAI\*" -Destination $dst -Recurse -Force

      - name: Configure Bright Nights
        shell: pwsh
        run: |
          $src = "$env:GITHUB_WORKSPACE\bn"
          $build = "$src\out\build\windows-tiles-sounds-x64-msvc"
          cmake -G Ninja `
            -S "$src" `
            -B "$build" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PROJECT_INCLUDE_BEFORE="$src\build-scripts\windows-tiles-sounds-x64-msvc.cmake" `
            -DCMAKE_TOOLCHAIN_FILE="$src\build-scripts\MSVC.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DDYNAMIC_LINKING=False `
            -DCURSES=False `
            -DLOCALIZE=False `
            -DTILES=True `
            -DSOUND=True `
            -DTESTS=True `
            -DRELEASE=ON `
            -DJSON_FORMAT=OFF `
            -DCATA_FORMAT_TARGETS=OFF `
            -DLUA_DOCS_ON_BUILD=OFF `
            -DCMAKE_INSTALL_MESSAGE=NEVER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Bright Nights and tests
        shell: pwsh
        run: |
          $build = "$env:GITHUB_WORKSPACE\bn\out\build\windows-tiles-sounds-x64-msvc"
          cmake --build "$build" --config Release --target cataclysm-bn-tiles cata_test-tiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Cataclysm AI Lua binding test
        shell: pwsh
        run: |
          $src = "$env:GITHUB_WORKSPACE\bn"
          $build = "$src\out\build\windows-tiles-sounds-x64-msvc"
          $testExe = Get-ChildItem -Path $build -Filter "cata_test-tiles.exe" -Recurse | Select-Object -First 1
          if (-not $testExe) {
            throw "cata_test-tiles.exe was not found under $build"
          }
          Push-Location $src
          try {
            & $testExe.FullName "[cataclysm_ai]"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Check Bright Nights mods
        shell: pwsh
        run: |
          $src = "$env:GITHUB_WORKSPACE\bn"
          $build = "$src\out\build\windows-tiles-sounds-x64-msvc"
          $gameExe = Get-ChildItem -Path $build -Filter "cataclysm-bn-tiles.exe" -Recurse | Select-Object -First 1
          if (-not $gameExe) {
            throw "cataclysm-bn-tiles.exe was not found under $build"
          }
          Push-Location $src
          try {
            & $gameExe.FullName --check-mods
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Create runnable distribution
        shell: pwsh
        run: |
          $src = "$env:GITHUB_WORKSPACE\bn"
          $build = "$src\out\build\windows-tiles-sounds-x64-msvc"
          $dist = "$env:GITHUB_WORKSPACE\artifact\CataclysmBN-CataclysmAI"
          Remove-Item -Recurse -Force "$dist" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$dist" | Out-Null

          cmake --install "$build" --prefix "$dist" --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $modDst = Join-Path $dist "data\mods\CataclysmAI"
          New-Item -ItemType Directory -Force -Path $modDst | Out-Null
          Copy-Item -Path "$env:GITHUB_WORKSPACE\mod\CataclysmAI\*" -Destination $modDst -Recurse -Force

          @"
          Cataclysm AI bridge prototype 0.1
          Bright Nights commit: $env:BN_REF
          Cataclysm AI commit: $env:GITHUB_SHA
          "@ | Set-Content -Path "$dist\CATACLYSM_AI_BUILD.txt" -Encoding UTF8

          $exe = Join-Path $dist "cataclysm-bn-tiles.exe"
          if (-not (Test-Path $exe)) {
            throw "Installed game executable not found: $exe"
          }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $server = Join-Path $dist "data\mods\CataclysmAI\server\start_echo_server.bat"
          if (-not (Test-Path $server)) {
            throw "Cataclysm AI sidecar launcher missing from distribution: $server"
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CataclysmBN-CataclysmAI-Windows
          path: artifact/CataclysmBN-CataclysmAI
          if-no-files-found: error
          compression-level: 6
