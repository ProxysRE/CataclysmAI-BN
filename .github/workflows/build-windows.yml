name: Build Cataclysm AI for Windows

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev/ci-v0.1" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      VCPKG_BINARY_SOURCES: "default"
      BN_REF: "660c2618548844449f88bdeae7af702b9f0cc83c"

    steps:
      - name: Checkout Cataclysm AI CI repository
        uses: actions/checkout@v4

      - name: Checkout pinned Bright Nights
        uses: actions/checkout@v4
        with:
          repository: cataclysmbn/Cataclysm-BN
          ref: ${{ env.BN_REF }}
          path: bn

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install stable CMake
        uses: lukka/get-cmake@v3.31.6

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable("ACTIONS_CACHE_URL", process.env.ACTIONS_CACHE_URL || "")
            core.exportVariable("ACTIONS_RESULTS_URL", process.env.ACTIONS_RESULTS_URL || "")
            core.exportVariable("ACTIONS_RUNTIME_TOKEN", process.env.ACTIONS_RUNTIME_TOKEN || "")

      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          $mode = "readwrite"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $mode = "read"
          }
          "VCPKG_BINARY_SOURCES=clear;x-gha,$mode" >> $env:GITHUB_ENV

      - name: Install vcpkg
        uses: lukka/run-vcpkg@main
        id: runvcpkg
        with:
          vcpkgDirectory: "${{ github.workspace }}/../b/vcpkg"

      - name: Integrate vcpkg
        shell: pwsh
        run: vcpkg integrate install

      - name: Apply Cataclysm AI engine bridge
        shell: pwsh
        run: .\scripts\apply_bridge.ps1 -BnRoot "$env:GITHUB_WORKSPACE\bn"

      - name: Install Cataclysm AI mod into source tree
        shell: pwsh
        run: |
          $dst = "$env:GITHUB_WORKSPACE\bn\data\mods\CataclysmAI"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path "$env:GITHUB_WORKSPACE\mod\CataclysmAI\*" -Destination $dst -Recurse -Force

      - name: Configure Bright Nights
        shell: pwsh
        run: |
          $src = "$env:GITHUB_WORKSPACE\bn"
          $build = "$src\out\build\windows-tiles-sounds-x64-msvc"
          cmake -G Ninja `
            -S "$src" `
            -B "$build" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PROJECT_INCLUDE_BEFORE="$src\build-scripts\windows-tiles-sounds-x64-msvc.cmake" `
            -DCMAKE_TOOLCHAIN_FILE="$src\build-scripts\MSVC.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DDYNAMIC_LINKING=False `
            -DCURSES=False `
            -DLOCALIZE=False `
            -DTILES=True `
            -DSOUND=True `
            -DTESTS=False `
            -DRELEASE=ON `
            -DJSON_FORMAT=OFF `
            -DCATA_FORMAT_TARGETS=OFF `
            -DCMAKE_INSTALL_MESSAGE=NEVER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Bright Nights
        shell: pwsh
        run: |
          $build = "$env:GITHUB_WORKSPACE\bn\out\build\windows-tiles-sounds-x64-msvc"
          cmake --build "$build" --config Release --target cataclysm-bn-tiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create runnable distribution
        shell: pwsh
        run: |
          $src = "$env:GITHUB_WORKSPACE\bn"
          $build = "$src\out\build\windows-tiles-sounds-x64-msvc"
          $dist = "$env:GITHUB_WORKSPACE\artifact\CataclysmBN-CataclysmAI"
          Remove-Item -Recurse -Force "$dist" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$dist" | Out-Null
          cmake --install "$build" --prefix "$dist" --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # CataclysmAI is injected into the checked-out BN tree after checkout and
          # is not part of upstream BN's generated CMake install manifest. Copy it
          # explicitly so the runnable artifact always contains the Lua mod and
          # external sidecar.
          $modSrc = "$env:GITHUB_WORKSPACE\mod\CataclysmAI"
          $modDst = Join-Path "$dist" "data\mods\CataclysmAI"
          Remove-Item -Recurse -Force "$modDst" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$modDst" | Out-Null
          Copy-Item -Path "$modSrc\*" -Destination "$modDst" -Recurse -Force

          @"
          Cataclysm AI bridge prototype 0.1
          Bright Nights commit: $env:BN_REF
          Cataclysm AI commit: $env:GITHUB_SHA
          "@ | Set-Content -Path "$dist\CATACLYSM_AI_BUILD.txt" -Encoding UTF8

          $exe = Join-Path "$dist" "cataclysm-bn-tiles.exe"
          if (-not (Test-Path "$exe")) {
            throw "Installed game executable not found: $exe"
          }
          & "$exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $server = Join-Path "$dist" "data\mods\CataclysmAI\server\start_echo_server.bat"
          if (-not (Test-Path "$server")) {
            throw "Cataclysm AI sidecar launcher missing from distribution: $server"
          }

      - name: Runtime smoke-test
        shell: pwsh
        run: |
          $dist = "$env:GITHUB_WORKSPACE\artifact\CataclysmBN-CataclysmAI"
          $exe = Join-Path "$dist" "cataclysm-bn-tiles.exe"
          $userDir = "$env:GITHUB_WORKSPACE\runtime-user"
          $typesPath = "$env:GITHUB_WORKSPACE\cataclysm_ai_types.lua"
          Remove-Item -Recurse -Force "$userDir" -ErrorAction SilentlyContinue
          Remove-Item -Force "$typesPath" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$userDir" | Out-Null

          # Validate that the packaged mod can be discovered and loaded by BN.
          # Force headless-friendly SDL/GPU backends on the hosted runner.
          $env:SDL_VIDEODRIVER = "dummy"
          Push-Location "$dist"
          try {
            & "$exe" --gpu-backend software --userdir "$userDir" --check-mods cataclysm_ai
            if ($LASTEXITCODE -ne 0) {
              throw "Bright Nights --check-mods cataclysm_ai failed with exit code $LASTEXITCODE"
            }

            # Generate LuaLS declarations from the actual compiled executable.
            # This proves the C++ bridge is registered in Lua, not merely compiled.
            & "$exe" --userdir "$userDir" --lua-types "$typesPath"
            if ($LASTEXITCODE -ne 0) {
              throw "Bright Nights --lua-types failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

          if (-not (Test-Path "$typesPath")) {
            throw "Lua type declaration file was not generated"
          }
          $types = Get-Content -Raw -Path "$typesPath"
          if ($types -notmatch "cataclysm_ai" -or $types -notmatch "exchange") {
            throw "Compiled Lua API does not expose cataclysm_ai.exchange"
          }
          Write-Host "Lua bridge registration smoke-test passed."

          # Exercise the exact packaged Python sidecar with a real request/response
          # file exchange. The game-facing C++ exchange itself is exercised manually
          # in the first playable runtime test after this CI artifact is produced.
          $serverScript = Join-Path "$dist" "data\mods\CataclysmAI\server\cataclysm_ai_server.py"
          if (-not (Test-Path "$serverScript")) {
            throw "Packaged Python sidecar is missing: $serverScript"
          }

          $configDir = Join-Path "$userDir" "config"
          New-Item -ItemType Directory -Force -Path "$configDir" | Out-Null
          $requestPath = Join-Path "$configDir" "cataclysm_ai_request.txt"
          $responsePath = Join-Path "$configDir" "cataclysm_ai_response.txt"
          Remove-Item -Force "$requestPath", "$responsePath" -ErrorAction SilentlyContinue

          $serverProcess = Start-Process -FilePath "python" `
            -ArgumentList @("$serverScript", "--config-dir", "$configDir") `
            -PassThru -NoNewWindow
          try {
            Start-Sleep -Milliseconds 500
            @"
          CATAI/1
          NPC_NAME: CI Tester
          NPC_HP_PERCENT: 100
          PLAYER_TEXT:
          bridge smoke test
          "@ | Set-Content -Path "$requestPath" -Encoding UTF8 -NoNewline

            for ($i = 0; $i -lt 100 -and -not (Test-Path "$responsePath"); $i++) {
              Start-Sleep -Milliseconds 100
            }
            if (-not (Test-Path "$responsePath")) {
              throw "Cataclysm AI sidecar did not produce a response within 10 seconds"
            }

            $response = Get-Content -Raw -Path "$responsePath"
            if ($response -notmatch "\[ECHO\]" -or $response -notmatch "bridge smoke test") {
              throw "Unexpected Cataclysm AI sidecar response: $response"
            }
            Write-Host "Sidecar file-IPC round-trip smoke-test passed: $response"
          }
          finally {
            if ($serverProcess -and -not $serverProcess.HasExited) {
              Stop-Process -Id $serverProcess.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CataclysmBN-CataclysmAI-Windows
          path: artifact/CataclysmBN-CataclysmAI
          if-no-files-found: error
          compression-level: 6
