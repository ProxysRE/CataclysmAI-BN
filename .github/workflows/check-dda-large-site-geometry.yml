name: Check DDA large-site geometry staging
on:
  workflow_dispatch:
  push:
    branches: [port/dda-npc-locations]
    paths:
      - npc-content/prepare_large_site_geometry.py
      - npc-content/adapt_large_site_geometry.py
      - npc-content/check_large_site_geometry.py
      - npc-content/geometry_layer/LARGE_SITES_*
      - npc-content/geometry_layer/large_sites_sources/**
      - .github/workflows/check-dda-large-site-geometry.yml
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python npc-content/check_large_site_geometry.py
