name: Build and test Cataclysm AI bridge plus Python sidecar for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    name: Cataclysm AI Python ECHO runtime / Windows MSVC
    runs-on: windows-2022

    steps:
      - name: Checkout Cataclysm AI project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout pristine Bright Nights
        uses: actions/checkout@v4
        with:
          repository: cataclysmbn/Cataclysm-BN
          ref: 17a0df280e6d009402bcc41ffafbce12670c4b99
          path: bn
          fetch-depth: 1

      - name: Validate Python ECHO sidecar
        shell: pwsh
        run: |
          python --version
          python -m py_compile "${{ github.workspace }}/project/sidecar/cataclysm_ai_sidecar.py"

      - name: Apply minimal Lua bridge and Python ECHO runtime test
        shell: pwsh
        working-directory: bn
        run: |
          $bridgePatch = "${{ github.workspace }}/project/patches/minimal-lua-bridge.patch"
          $testPatch = "${{ github.workspace }}/project/patches/runtime-exchange-test.patch"
          git apply --check $bridgePatch
          git apply $bridgePatch
          git apply --check $testPatch
          git apply $testPatch
          git diff --check
          git diff --stat

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install stable CMake
        uses: lukka/get-cmake@v3.31.6

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable("ACTIONS_CACHE_URL", process.env.ACTIONS_CACHE_URL || "")
            core.exportVariable("ACTIONS_RESULTS_URL", process.env.ACTIONS_RESULTS_URL || "")
            core.exportVariable("ACTIONS_RUNTIME_TOKEN", process.env.ACTIONS_RUNTIME_TOKEN || "")

      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> $env:GITHUB_ENV

      - name: Install vcpkg
        uses: lukka/run-vcpkg@main
        with:
          vcpkgDirectory: "${{ github.workspace }}/vcpkg"

      - name: Integrate vcpkg
        shell: pwsh
        run: vcpkg integrate install

      - name: Configure Bright Nights with Cataclysm AI bridge tests
        shell: pwsh
        working-directory: bn
        env:
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\bn\.github\vcpkg_triplets
        run: |
          cmake -G Ninja `
            -S "${{ github.workspace }}/bn" `
            -B "${{ github.workspace }}/bn/out/build/windows-tiles-sounds-x64-msvc" `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_PROJECT_INCLUDE_BEFORE="${{ github.workspace }}/bn/build-scripts/windows-tiles-sounds-x64-msvc.cmake" `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/bn/build-scripts/MSVC.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DDYNAMIC_LINKING=False `
            -DCURSES=False `
            -DLOCALIZE=False `
            -DTILES=True `
            -DSOUND=True `
            -DTESTS=True `
            -DRELEASE=OFF `
            -DJSON_FORMAT=OFF `
            -DCATA_FORMAT_TARGETS=OFF `
            -DCMAKE_INSTALL_MESSAGE=NEVER

      - name: Build Bright Nights and Lua tests
        shell: pwsh
        working-directory: bn
        run: |
          cmake --build "${{ github.workspace }}/bn/out/build/windows-tiles-sounds-x64-msvc" `
            --config Release `
            --target cataclysm-bn-tiles cata_test-tiles

      - name: Run Cataclysm AI Python ECHO round-trip test
        shell: pwsh
        working-directory: bn
        run: |
          $testExe = Get-ChildItem "${{ github.workspace }}/bn/out/build/windows-tiles-sounds-x64-msvc" -Filter "cata_test-tiles.exe" -Recurse | Select-Object -First 1
          if ($null -eq $testExe) {
            throw "cata_test-tiles.exe was not found."
          }

          Write-Host "Test executable: $($testExe.FullName)"
          Write-Host "Discovering Cataclysm AI runtime test..."
          & $testExe.FullName --list-tests "[cataclysm_ai]"
          $listExitCode = $LASTEXITCODE
          if ($listExitCode -ne 0) {
            throw "Catch2 could not discover [cataclysm_ai] tests; exit code $listExitCode."
          }

          $sidecarScript = "${{ github.workspace }}/project/sidecar/cataclysm_ai_sidecar.py"
          $testUserDir = "${{ github.workspace }}/bn/test_user_dir"
          $testConfigDir = Join-Path $testUserDir "config"
          $sidecarStdout = "${{ github.workspace }}/sidecar.stdout.log"
          $sidecarStderr = "${{ github.workspace }}/sidecar.stderr.log"
          $requestFile = Join-Path $testConfigDir "cataclysm_ai_request.txt"
          $responseFile = Join-Path $testConfigDir "cataclysm_ai_response.txt"

          Remove-Item $sidecarStdout -Force -ErrorAction SilentlyContinue
          Remove-Item $sidecarStderr -Force -ErrorAction SilentlyContinue

          Write-Host "Explicit test user dir: $testUserDir"
          Write-Host "Expected sidecar config dir: $testConfigDir"
          Write-Host "Expected request file: $requestFile"
          Write-Host "Expected response file: $responseFile"

          $sidecar = Start-Process -FilePath "python" `
            -ArgumentList @($sidecarScript, "--once", "--timeout", "600", "--config-dir", $testConfigDir) `
            -RedirectStandardOutput $sidecarStdout `
            -RedirectStandardError $sidecarStderr `
            -PassThru

          Start-Sleep -Milliseconds 250
          if ($sidecar.HasExited) {
            Write-Host "Sidecar exited before cata_test started. Exit code: $($sidecar.ExitCode)"
          } else {
            Write-Host "Sidecar PID: $($sidecar.Id)"
          }

          & $testExe.FullName "--user-dir=$testUserDir" "[cataclysm_ai]"
          $testExitCode = $LASTEXITCODE

          if (-not $sidecar.WaitForExit(15000)) {
            Write-Host "Sidecar did not exit within 15 seconds after cata_test; stopping it."
            Stop-Process -Id $sidecar.Id -Force -ErrorAction SilentlyContinue
            $sidecar.WaitForExit()
          }
          $sidecarExitCode = $sidecar.ExitCode

          Write-Host "--- Python sidecar stdout ---"
          if (Test-Path $sidecarStdout) { Get-Content $sidecarStdout }
          Write-Host "--- Python sidecar stderr ---"
          if (Test-Path $sidecarStderr) { Get-Content $sidecarStderr }

          Write-Host "--- IPC path state after test ---"
          Write-Host "config exists: $(Test-Path $testConfigDir)"
          Write-Host "request exists: $(Test-Path $requestFile)"
          Write-Host "response exists: $(Test-Path $responseFile)"
          if (Test-Path $requestFile) {
            Write-Host "request contents:"
            Get-Content $requestFile -Raw
          }
          if (Test-Path $responseFile) {
            Write-Host "response contents:"
            Get-Content $responseFile -Raw
          }
          if (Test-Path $testUserDir) {
            Write-Host "--- Test user directory tree ---"
            Get-ChildItem $testUserDir -Force -Recurse | Select-Object FullName, Length, LastWriteTime
          }

          Write-Host "cata_test exit code: $testExitCode"
          Write-Host "sidecar exit code: $sidecarExitCode"

          if ($testExitCode -ne 0) {
            throw "Cataclysm AI Python ECHO Lua runtime test failed with exit code $testExitCode."
          }
          if ($sidecarExitCode -ne 0) {
            throw "Python ECHO sidecar failed with exit code $sidecarExitCode."
          }

      - name: Verify executable
        shell: pwsh
        working-directory: bn
        run: |
          $exe = Get-ChildItem "${{ github.workspace }}/bn/out/build/windows-tiles-sounds-x64-msvc" -Filter "cataclysm-bn-tiles.exe" -Recurse | Select-Object -First 1
          if ($null -eq $exe) {
            throw "Build finished but cataclysm-bn-tiles.exe was not found."
          }
          Write-Host "Built executable: $($exe.FullName)"
          & $exe.FullName --version
          "BN_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Upload compiled executable
        uses: actions/upload-artifact@v4
        with:
          name: cataclysm-ai-python-echo-tested-windows-exe
          path: ${{ env.BN_EXE }}
          if-no-files-found: error
