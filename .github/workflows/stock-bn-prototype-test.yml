name: Test stock BN AI prototype

on:
  push:
    branches:
      - dev/stock-bn-lua-ipc
  pull_request:
    paths:
      - "stock-bn-prototype/**"
      - ".github/workflows/stock-bn-prototype-test.yml"

jobs:
  protocol-tests:
    name: Python and Lua protocol checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python tools
        run: |
          python -m py_compile stock-bn-prototype/sidecar/memory.py
          python -m py_compile stock-bn-prototype/sidecar/providers.py
          python -m py_compile stock-bn-prototype/sidecar/provider_selftest.py
          python -m py_compile stock-bn-prototype/sidecar/cataclysm_ai_stock_sidecar.py
          python -m py_compile stock-bn-prototype/launch_stock_bn_ai.py

      - name: Run sidecar self-test
        run: python stock-bn-prototype/sidecar/cataclysm_ai_stock_sidecar.py --self-test

      - name: Run model provider self-test
        run: python stock-bn-prototype/sidecar/provider_selftest.py

      - name: Install Lua 5.3
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3

      - name: Check Lua syntax
        run: luac5.3 -p stock-bn-prototype/mod/CataclysmAI/main.lua

  stock-nightly-load-test:
    name: Official Windows BN stock IPC primitives
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      BN_TAG: "2026-08-24"
      BN_ASSET: "cbn-windows-tiles-x64-msvc-no-soundpack-2026-08-24.zip"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download official Bright Nights nightly
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/cataclysmbn/Cataclysm-BN/releases/download/$env:BN_TAG/$env:BN_ASSET"
          $zip = Join-Path $env:RUNNER_TEMP "bright-nights.zip"
          Write-Host "Downloading official stock BN asset: $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          if (-not (Test-Path $zip)) { throw "BN archive was not downloaded" }
          Write-Host "Downloaded $((Get-Item $zip).Length) bytes"

      - name: Unpack stock Bright Nights and locate executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "bright-nights.zip"
          $extract = Join-Path $env:RUNNER_TEMP "bright-nights"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $exe = Get-ChildItem -Path $extract -Recurse -File -Filter "cataclysm-bn-tiles.exe" | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem -Path $extract -Recurse -Depth 2 | Select-Object FullName
            throw "cataclysm-bn-tiles.exe not found in official archive"
          }
          $gameDir = $exe.Directory.FullName
          "CATAI_BN_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CATAI_BN_DIR=$gameDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Stock executable: $($exe.FullName)"
          Write-Host "Stock game directory: $gameDir"
          Get-ChildItem -Path $gameDir | Select-Object Name, Length, Mode

      - name: Install Cataclysm AI through the stock launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $userDir = Join-Path $env:RUNNER_TEMP "catai-stock-user"
          python stock-bn-prototype/launch_stock_bn_ai.py `
            "$env:CATAI_BN_DIR" `
            --user-dir "$userDir" `
            --install-only
          if ($LASTEXITCODE -ne 0) { throw "stock launcher install-only validation failed" }

          $modDest = Join-Path $userDir "mods/CataclysmAI"
          if (-not (Test-Path (Join-Path $modDest "main.lua"))) {
            throw "launcher did not install CataclysmAI/main.lua"
          }
          "CATAI_USER_DIR=$userDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CATAI_MOD_DIR=$modDest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Installed mod at $modDest"

      - name: Inject stock IPC primitive probes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $probeDir = Join-Path $env:CATAI_BN_DIR "data/lua/lib/catai_runtime"
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $probePath = Join-Path $probeDir "stock_probe.lua"
          @'
          return {
            protocol = 1,
            token = "CATAI_STOCK_REQUIRE_OK"
          }
          '@ | Set-Content -Path $probePath -Encoding utf8

          $mainLua = Join-Path $env:CATAI_MOD_DIR "main.lua"
          @'

          -- CI-only probes appended after launcher installation. They are not part of the shipped mod.
          local catai_probe = require("lib.catai_runtime.stock_probe")
          assert(type(catai_probe) == "table", "Cataclysm AI stock require probe returned non-table")
          assert(catai_probe.protocol == 1, "Cataclysm AI stock require probe protocol mismatch")
          assert(catai_probe.token == "CATAI_STOCK_REQUIRE_OK", "Cataclysm AI stock require probe token mismatch")
          gdebug.log_info("CATAI_STOCK_REQUIRE_OK")
          package.loaded["lib.catai_runtime.stock_probe"] = nil

          local catai_storage = game.mod_storage[game.current_mod]
          assert(type(catai_storage) == "table", "Cataclysm AI stock mod_storage is unavailable")
          catai_storage.ipc_request = {
              protocol = 1,
              request_id = "ci_stock_1",
              npc_id = "ci_npc",
              npc_name = "CI NPC",
              player_name = "CI Player",
              player_text = "stock outbound ping",
              current_turn = tostring(gapi.current_turn())
          }
          gdebug.log_info("CATAI_STOCK_SAVE_BEGIN")
          local catai_saved = gdebug.save_game()
          gdebug.log_info("CATAI_STOCK_SAVE_RESULT=" .. tostring(catai_saved))
          assert(catai_saved, "Cataclysm AI stock save_game probe failed")
          gdebug.log_info("CATAI_STOCK_SAVE_OK")
          '@ | Add-Content -Path $mainLua -Encoding utf8

      - name: Show stock resolved paths
        shell: pwsh
        run: |
          Push-Location $env:CATAI_BN_DIR
          try {
            & $env:CATAI_BN_EXE `
              "--basepath" "$env:CATAI_BN_DIR" `
              "--userdir" "$env:CATAI_USER_DIR" `
              "--paths"
          } finally {
            Pop-Location
          }

      - name: Verify stock Lua IPC primitives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stdout = Join-Path $env:RUNNER_TEMP "stock-bn-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "stock-bn-stderr.txt"
          $args = @(
            "--basepath", $env:CATAI_BN_DIR,
            "--userdir", $env:CATAI_USER_DIR,
            "--dont-debugmsg",
            "--check-mods", "cataclysm_ai"
          )

          Push-Location $env:CATAI_BN_DIR
          try {
            $process = Start-Process `
              -FilePath $env:CATAI_BN_EXE `
              -ArgumentList $args `
              -Wait `
              -PassThru `
              -NoNewWindow `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr
            $exitCode = $process.ExitCode
          } finally {
            Pop-Location
          }

          Write-Host "cataclysm-bn-tiles.exe exit code: $exitCode"
          if (Test-Path $stdout) {
            Write-Host "--- stock BN stdout ---"
            Get-Content $stdout
          }
          if (Test-Path $stderr) {
            Write-Host "--- stock BN stderr ---"
            Get-Content $stderr
          }

          $debugLog = Join-Path $env:CATAI_USER_DIR "config/debug.log"
          if (Test-Path $debugLog) {
            Write-Host "--- stock BN debug.log tail ---"
            Get-Content $debugLog -Tail 240
          } else {
            throw "Official stock BN did not create debug.log"
          }

          if ($exitCode -ne 0) {
            throw "Official stock BN rejected Cataclysm AI (exit $exitCode)"
          }
          if (-not (Select-String -Path $debugLog -SimpleMatch "CATAI_STOCK_REQUIRE_OK" -Quiet)) {
            throw "Stock BN did not resolve the runtime require() probe"
          }
          if (-not (Select-String -Path $debugLog -SimpleMatch "CATAI_STOCK_SAVE_RESULT=true" -Quiet)) {
            throw "Stock BN save_game() did not report success"
          }
          if (-not (Select-String -Path $debugLog -SimpleMatch "CATAI_STOCK_SAVE_OK" -Quiet)) {
            throw "Stock BN did not complete the mod_storage/save probe"
          }

          Write-Host "Official stock BN confirmed mod load, require(), mod_storage, and save_game()."
