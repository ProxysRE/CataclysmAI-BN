name: Check DDA content layers
on:
  push:
    branches: [port/dda-npc-locations]
    paths: ['npc-content/**', '.github/workflows/check-dda-content-layers.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dda-content-layers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read pinned BN JSON definitions for native dependency validation
        uses: actions/checkout@v4
        with:
          repository: cataclysmbn/Cataclysm-BN
          ref: c621aaf42fa182473aad10feea2b55647704dcf1
          path: bn-data
          sparse-checkout: data/json
          persist-credentials: false
      - name: Validate church dependencies against all pinned BN JSON definitions
        run: |
          python npc-content/prepare_rural_churches.py --check --bn-source bn-data
          python npc-content/prepare_xedra_creature.py --check --bn-data bn-data
          python npc-content/prepare_xedra_gear.py --check --bn-source bn-data
          python npc-content/prepare_karting.py --check --bn-data bn-data
          python npc-content/check_karting.py
          python npc-content/prepare_mapgen_corpses.py
      - name: Verify bulk regional location staging and audit pinned BN references
        run: |
          python npc-content/export_bn_ids.py --bn-source bn-data --output bn-id-index.json --cache npc-content/dependency_catalog/BN_ID_INDEX.json
          python npc-content/check_regional_locations.py
          python npc-content/check_farm_supply.py
          python npc-content/prepare_farm_supply.py --check --bn-source bn-data --audit --report farm-native-dependency-audit.json
          python npc-content/prepare_regional_locations.py --check --bn-source bn-data --native-payload npc-content/native/dda_karting_circuit.json --report regional-dependency-audit.json
      - name: Preserve full regional dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: regional-location-dependency-audit
          path: |
            regional-dependency-audit.json
            farm-native-dependency-audit.json
            bn-id-index.json
          retention-days: 30
      - name: Compare pinned DDA and BN location catalogs
        run: python npc-content/check_location_catalog.py
      - name: Reconstruct preserved artisan sources
        run: python npc-content/prepare_isolated_road.py --output npc-content/staging
      - name: Reject stale native patch sources
        run: python npc-content/check_native_patch_sources.py
      - name: Check portable Windows archive packaging
        run: python npc-content/check_windows_package.py
      - name: Verify quest USB item adaptation
        run: python npc-content/check_quest_usb.py
      - name: Verify typed weapon dependencies and casing adaptation
        run: |
          python npc-content/check_quest_dependency_graph.py
          python npc-content/check_quest_ammo.py
      - name: Verify quest props and typed BN reuse
        run: |
          python npc-content/check_quest_props.py
          python npc-content/check_reused_bn_definitions.py
      - name: Check existing nuclear station and Hub expansion
        run: |
          python npc-content/check_location_expansion.py
          python npc-content/check_hub_access.py
          python npc-content/check_hub_elevator.py
          python npc-content/check_location_windows_encoding.py
      - name: Verify radio station tower expansion
        run: python npc-content/check_radio_stations.py
      - name: Verify hotel cap geometry and additive city composition
        run: python npc-content/check_hotel_roofs.py
      - name: Verify shopping plaza roof footprint and city composition
        run: python npc-content/check_shopping_plaza.py
      - name: Verify complete rural church and XEDRA dependency preservation
        run: python npc-content/check_rural_churches.py
      - name: Verify native XEDRA creature and source-driven pull configuration
        run: python npc-content/check_xedra_creature.py
      - name: Verify XEDRA activity suit state transitions
        run: python npc-content/check_xedra_gear.py
      - name: Verify selective location dependencies and layouts
        run: python npc-content/check_location_layers.py
      - name: Verify every staged definition and blocked original
        run: python npc-content/check_community_layers.py
      - name: Prevent duplicate location and mapgen plans
        run: python npc-content/check_location_merge_plan.py
      - name: Verify reviewed changes to existing BN locations
        run: python npc-content/check_existing_location_merges.py
      - name: Verify dialogue compiler and safe EOC expansion
        run: python npc-content/check_artisan_adapter.py
      - name: Verify lighthouse map and encounter links
        run: |
          python npc-content/check_lighthouse_links.py
          python npc-content/check_lighthouse_encounter.py
      - name: Verify island prison placement
        run: python npc-content/check_prison_placement.py
