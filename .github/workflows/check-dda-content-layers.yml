name: Check DDA content layers
on:
  push:
    branches: [port/dda-npc-locations]
    paths: ['npc-content/**', '.github/workflows/check-dda-content-layers.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dda-content-layers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare pinned DDA and BN location catalogs
        run: python npc-content/check_location_catalog.py
      - name: Reconstruct preserved artisan sources
        run: python npc-content/prepare_isolated_road.py --output npc-content/staging
      - name: Reject stale native patch sources
        run: python npc-content/check_native_patch_sources.py
      - name: Check portable Windows archive packaging
        run: python npc-content/check_windows_package.py
      - name: Verify quest USB item adaptation
        run: python npc-content/check_quest_usb.py
      - name: Verify typed weapon dependencies and casing adaptation
        run: |
          python npc-content/check_quest_dependency_graph.py
          python npc-content/check_quest_ammo.py
      - name: Verify quest props and typed BN reuse
        run: |
          python npc-content/check_quest_props.py
          python npc-content/check_reused_bn_definitions.py
      - name: Check existing nuclear station and Hub expansion
        run: |
          python npc-content/check_location_expansion.py
          python npc-content/check_hub_access.py
          python npc-content/check_hub_elevator.py
          python npc-content/check_location_windows_encoding.py
      - name: Verify selective location dependencies and layouts
        run: python npc-content/check_location_layers.py
      - name: Verify every staged definition and blocked original
        run: python npc-content/check_community_layers.py
      - name: Prevent duplicate location and mapgen plans
        run: python npc-content/check_location_merge_plan.py
      - name: Verify reviewed changes to existing BN locations
        run: python npc-content/check_existing_location_merges.py
      - name: Verify dialogue compiler and safe EOC expansion
        run: python npc-content/check_artisan_adapter.py
      - name: Verify lighthouse map and encounter links
        run: |
          python npc-content/check_lighthouse_links.py
          python npc-content/check_lighthouse_encounter.py
      - name: Verify island prison placement
        run: python npc-content/check_prison_placement.py
