name: Check DDA survivor housing and Lacroix staging
on:
  push:
    paths:
      - 'npc-content/prepare_survivor_geometry.py'
      - 'npc-content/check_survivor_geometry.py'
      - 'npc-content/adapt_survivor_geometry.py'
      - 'npc-content/prepare_survivor_preview.py'
      - 'npc-content/check_survivor_preview.py'
      - 'npc-content/prepare_geometry_preview.py'
      - 'npc-content/check_geometry_preview_layout.py'
      - 'npc-content/geometry_layer/SURVIVOR_*'
      - 'npc-content/geometry_layer/survivor_sources/**'
      - 'npc-content/geometry_layer/survivor_adaptation_sources/**'
      - '.github/workflows/check-dda-survivor-geometry.yml'
  workflow_dispatch:
jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python npc-content/check_survivor_geometry.py
      - run: python npc-content/adapt_survivor_geometry.py --check
      - run: python npc-content/check_survivor_preview.py
      - run: python npc-content/prepare_geometry_preview.py --check
      - run: python npc-content/check_geometry_terrain_schema.py
      - run: python npc-content/check_geometry_preview_layout.py
