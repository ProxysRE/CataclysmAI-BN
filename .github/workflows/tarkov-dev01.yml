name: Tarkov DEV0.1 validation and BN runtime

on:
  push:
    branches: [ project/tarkov-dev01 ]
    paths: [ 'tarkov/**', '.github/workflows/tarkov-dev01.yml' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarkov-dev01-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fast-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.6
      - run: python tarkov/tools/check.py
      - uses: actions/upload-artifact@v4
        with:
          name: Tarkov_DEV0.1_mod_source
          path: tarkov/

  bn-runtime:
    needs: fast-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cataclysmbn/Cataclysm-BN
          ref: 554950f3635f50ddd1d32c6e1b6e2bdee9842bd6
          path: bn
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev libsqlite3-dev zlib1g-dev libvulkan-dev mesa-vulkan-drivers libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libasound2-dev libpulse-dev autoconf autoconf-archive automake libtool libltdl-dev
      - uses: aminya/setup-cpp@v1
        with:
          compiler: llvm-22
          cmake: true
          ninja: true
          setup-cpp: false
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: tarkov-bn-554950f-clang22
          max-size: 3G
      - name: Install prototype and real-engine tests
        run: python3 tarkov/tools/install_into_bn.py bn --tests
      # The key covers every compiled project input. Content-only Lua/JSON edits
      # reuse objects, but always run CMake/Ninja, mod validation and native tests.
      - name: Stabilize pinned source timestamps
        run: python3 tarkov/tools/stabilize_build_inputs.py bn
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: bn/build
          key: trkv-native-v1-${{ runner.os }}-${{ hashFiles('tarkov/baseline.json', 'tarkov/tests/bn_harness.cpp.inc', 'tarkov/tools/install_into_bn.py', 'tarkov/tools/stabilize_build_inputs.py', '.github/workflows/tarkov-dev01.yml') }}
      - name: Configure BN
        run: >-
          cmake -S bn -B bn/build -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE='-O0 -DNDEBUG'
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=${{ github.workspace }}/bn/build/bin
          -DCURSES=ON -DTILES=OFF -DSOUND=OFF -DTESTS=ON
          -DLOCALIZE=OFF -DLANGUAGES=none -DBACKTRACE=OFF -DRELEASE=ON
          -DUSE_PREFIX_DATA_DIR=OFF -DUSE_HOME_DIR=OFF
          -DCATA_FORMAT_TARGETS=OFF -DLUA_DOCS_ON_BUILD=OFF
          -DBUILD_SHADERCROSS=ON -DSHADER_TARGETS=spirv
      - name: Build game and tests
        run: cmake --build bn/build --target cataclysm-bn cata_test --parallel 3
      # Save immediately after successful compilation even if a runtime check
      # later fails. A missing cache is harmless: the normal build still runs.
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: bn/build
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Validate mod through the game executable
        timeout-minutes: 5
        working-directory: bn
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
        run: ./build/bin/cataclysm-bn --check-mods trkv_raid_core
      - name: Run actual BN lifecycle and persistence test
        timeout-minutes: 15
        working-directory: bn
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
        run: ./build/bin/cata_test --mods=trkv_raid_core '[tarkov]' --rng-seed 20261020 --reporter junit --out ../tarkov-runtime.xml
      - name: Print runtime diagnostics
        if: always()
        run: |
          for log in bn/config/debug.log bn/user/config/debug.log tarkov-runtime.xml; do
            if [ -f "$log" ]; then
              echo "Log: $log"
              tail -n 180 "$log"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tarkov_DEV0.1_runtime_logs
          path: |
            tarkov-runtime.xml
            bn/build/CMakeFiles/CMakeConfigureLog.yaml
            bn/config/debug.log
            bn/user/config/debug.log
