name: Check DDA research geometry staging
on:
  workflow_dispatch:
  push:
    branches: [port/dda-npc-locations]
    paths:
      - npc-content/prepare_research_geometry.py
      - npc-content/adapt_research_geometry.py
      - npc-content/check_geometry_runtime_rules.py
      - npc-content/geometry_layer/runtime_sources/**
      - npc-content/geometry_layer/RESEARCH_*
      - npc-content/geometry_layer/research_sources/**
      - .github/workflows/check-dda-research-geometry.yml
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python npc-content/prepare_research_geometry.py --check
      - run: python npc-content/adapt_research_geometry.py --check
      - run: python npc-content/prepare_geometry_preview.py --check
      - run: python npc-content/check_geometry_terrain_schema.py
      - run: python npc-content/check_geometry_preview_layout.py
